<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | .danki studio</title>
    
    <!-- Import Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================
           1. DANKI BRAND VARIABLES & RESET
           ========================================== */
        :root {
            --bg-charcoal: #121212;
            --text-main: #FFFFFF;
            --text-muted: #737373;
            --neon-green: #33FFA2;
            --neon-violet: #FF33FF;
            --card-bg: #1A1A1A;
            --border-color: #2A2A2A;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-charcoal);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color 0.3s ease;
        }

        /* ==========================================
           2. HEADER & NAVIGATION
           ========================================== */
        header {
            padding: 2rem 5%;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--neon-violet);
        }

        /* The New Global Navigation */
        .global-nav {
            display: flex;
            gap: 2.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .global-nav a {
            color: var(--text-muted);
            padding-bottom: 5px;
        }

        .global-nav a:hover {
            color: var(--neon-green);
        }

        .global-nav a.current-page {
            color: var(--text-main);
            border-bottom: 2px solid var(--neon-violet);
        }

        /* Social Icons */
        .social-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }

        .social-links a svg {
            width: 24px;
            height: 24px;
            fill: var(--text-muted);
            transition: fill 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover svg {
            fill: var(--text-main);
            transform: translateY(-2px);
        }

        /* ==========================================
           3. ABOUT PAGE LAYOUT
           ========================================== */
        .about-container {
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 5%;
        }

        .about-title {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .about-interests {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .about-interests span {
            color: var(--border-color);
            margin: 0 10px;
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                gap: 1.5rem;
            }
            .global-nav {
                gap: 1.5rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            .about-title {
                font-size: 2.5rem;
            }
        }
                /* ==========================================
           4. TERMINAL CALL TO ACTION
           ========================================== */
        .cta-terminal {
            display: inline-block;
            margin-top: 2rem;
            font-family: 'Courier New', Courier, monospace; /* Gives it the code look */
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--neon-green);
            text-decoration: none;
            padding: 12px 24px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .cta-terminal:hover {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(51, 255, 162, 0.15);
            transform: translateY(-3px);
            color: var(--text-main);
        }

        /* The blinking block cursor */
        .cursor {
            display: inline-block;
            width: 10px;
            height: 1.2rem;
            background-color: var(--neon-green);
            vertical-align: text-bottom;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }

        .cta-terminal:hover .cursor {
            background-color: var(--text-main);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-top">
            <a href="index.html" class="logo"><span>.</span>danki studio</a>
            
            <!-- Global Navigation -->
            <nav class="global-nav">
                <a href="index.html" class="current-page">About</a>
                <a href="data.html">Data Management</a>

            <!-- Original SVG Social Icons -->

                    </svg>
                </a>
                <a href="https://www.linkedin.com/in/adeline-navy/" target="_blank" aria-label="LinkedIn">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                    </svg>
                </a>
            </div>
        </div>
    </header>


    <!-- MAIN ABOUT CONTENT -->
    <main class="about-container">
        <h1 class="about-title">nambona adeline</h1>
        <p class="about-interests">
            Data Feminism <span>•</span> Medieval History <span>•</span> Financial Analytics <span>•</span> Impact & Sustainability
        </p>
        
        <!-- NEW TERMINAL BUTTON -->
        <a href="mailto:hello@dankistudio.com" class="cta-terminal">
            <span id="typing-text"></span><span class="cursor"></span>
        </a>
        
    </main>

    <!-- TYPING EFFECT SCRIPT -->
    <script>
        // 1. Put the function you chose here!
        const textToType = "> initiate_collaboration()";
        
        const typeTarget = document.getElementById("typing-text");
        let i = 0;

        function typeWriter() {
            if (i < textToType.length) {
                typeTarget.innerHTML += textToType.charAt(i);
                i++;
                // 2. Adjust typing speed here (lower number = faster)
                setTimeout(typeWriter, 100); 
            }
        }

        // Start typing 0.5 seconds after the page loads
        setTimeout(typeWriter, 500);
    </script>
    
</body>
</html>
